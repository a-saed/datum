name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w datum-sync

      - name: Build docs
        run: npm run docs:build

      - name: Build demo
        run: npm run build -w datum-demo
        env:
          VITE_BASE_URL: /datum/demo/
          VITE_DATUM_SERVER_URL: ${{ vars.DATUM_SERVER_URL }}
          VITE_DATUM_AUTH_TOKEN: ${{ secrets.DATUM_AUTH_TOKEN }}

      - name: Copy demo into docs output
        run: mkdir -p docs/.vitepress/dist/demo && cp -r demo/dist/* docs/.vitepress/dist/demo/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
