name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -w datum-sync

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/server/go.sum

      - name: Test
        run: go test ./...
        working-directory: packages/server

  cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # ubuntu-latest runners ship Docker and Go, so the CLI's Docker-tier integration test
      # runs for real here (it skips cleanly wherever either prerequisite is missing).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/server/go.sum

      - name: Install dependencies
        run: npm ci

      # The CLI's Docker-tier integration test spawns `npx --package=datum-sync datum-mcp`,
      # which resolves to this workspace's local build via npm's workspace resolution — but
      # only if that build exists. Build it first so the test exercises this branch's code
      # instead of falling through to a stale or registry-published datum-sync.
      - name: Build datum-sync
        run: npm run build -w datum-sync

      # On a genuinely fresh, cold-cache `npm ci` (exactly what every CI run is), the
      # datum-sync workspace package's `datum-mcp` bin is not always linked into the root
      # node_modules/.bin/ — confirmed by reproducing this in an isolated clone: a first-ever
      # `npm ci` on that clone left node_modules/.bin/datum-mcp missing entirely, causing every
      # `npx --package=datum-sync datum-mcp` invocation to fail with "datum-mcp: not found".
      # `npm rebuild` re-links bins for already-installed packages without re-fetching anything,
      # and reliably fixes this — verified the same way (missing before, present after).
      - name: Repair bin links after build
        run: npm rebuild

      - name: Test
        run: npm test -w datum-cli
