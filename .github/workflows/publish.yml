name: Publish to npm

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/client/package.json'
      - 'packages/cli/package.json'
    branches:
      - main

jobs:
  cross-compile-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            package: server-linux-x64
          - goos: linux
            goarch: arm64
            package: server-linux-arm64
          - goos: darwin
            goarch: amd64
            package: server-darwin-x64
          - goos: darwin
            goarch: arm64
            package: server-darwin-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/server/go.sum

      - name: Build
        working-directory: packages/server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o ../${{ matrix.package }}/bin/datum-server .

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: version
        run: echo "tag=$(node -p "require('./packages/cli/package.json').version")" >> $GITHUB_OUTPUT

      - name: Set package version
        working-directory: packages/${{ matrix.package }}
        run: npm version ${{ steps.version.outputs.tag }} --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Client tests
        run: npm test -w datum-sync

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/server/go.sum

      - name: Server tests
        run: go test ./...
        working-directory: packages/server

      - name: CLI tests
        run: npm test -w datum-cli

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci
        working-directory: packages/client

      - name: Build
        run: npm run build
        working-directory: packages/client

      - name: Publish
        run: npm publish --access public
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: CLI tests
        run: npm test -w datum-cli

      - name: Build CLI
        run: npm run build
        working-directory: packages/cli

      - name: Publish CLI
        run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        run: |
          VERSION=$(node -p "require('./packages/client/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
