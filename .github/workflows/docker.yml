name: Build and deploy server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cross-compile-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            package: server-linux-x64
          - goos: linux
            goarch: arm64
            package: server-linux-arm64
          - goos: darwin
            goarch: amd64
            package: server-darwin-x64
          - goos: darwin
            goarch: arm64
            package: server-darwin-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: packages/server/go.sum

      - name: Build
        working-directory: packages/server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -o ../${{ matrix.package }}/bin/datum-server .

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: version
        run: echo "tag=$(node -p "require('./packages/cli/package.json').version")" >> $GITHUB_OUTPUT

      - name: Set package version
        working-directory: packages/${{ matrix.package }}
        run: npm version ${{ steps.version.outputs.tag }} --no-git-tag-version --allow-same-version

      - name: Publish
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "tag=$(node -p "require('./packages/client/package.json').version")" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ghcr.io/a-saed/datum-server:latest
            ghcr.io/a-saed/datum-server:${{ steps.version.outputs.tag }}

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.5
        with:
          args: deploy --image ghcr.io/a-saed/datum-server:${{ steps.version.outputs.tag }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
