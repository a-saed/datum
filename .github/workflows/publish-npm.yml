name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build -w datum-sync

      - name: Run tests
        run: npm test -w datum-sync

      - name: Publish to npm
        run: npm publish -w datum-sync --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
