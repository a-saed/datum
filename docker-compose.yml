services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: datum
      POSTGRES_PASSWORD: datum
      POSTGRES_DB: datum
    ports:
      - "5432:5432"
    volumes:
      - datum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datum"]
      interval: 5s
      timeout: 5s
      retries: 5

  datum-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgres://datum:datum@postgis:5432/datum"
    volumes:
      - ./datum.dev.yaml:/app/datum.dev.yaml
    command: ["-config", "/app/datum.dev.yaml"]
    depends_on:
      postgis:
        condition: service_healthy
    restart: on-failure

volumes:
  datum_pgdata:
