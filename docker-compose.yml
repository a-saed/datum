services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: datum
      POSTGRES_PASSWORD: datum
      POSTGRES_DB: datum
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datum"]
      interval: 5s
      timeout: 5s
      retries: 5

  datum-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3000:3000"
    command: ["-db", "postgres://datum:datum@postgis:5432/datum", "-table", "features", "-port", "3000"]
    depends_on:
      postgis:
        condition: service_healthy
