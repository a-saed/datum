# fly.toml app configuration file generated for datum-server on 2026-05-27T16:35:22+03:00

app = 'datum-server'
primary_region = 'cdg'

[build]
  image = 'ghcr.io/a-saed/datum-server'

[processes]
  app = "/app/datum-server -db $DATABASE_URL -table features -allowed-origin https://a-saed.github.io"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
